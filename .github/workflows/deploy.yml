name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Pull latest code on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/caad
            git pull origin main
            echo "Deployed at $(date)"
