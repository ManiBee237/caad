<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Outer circle - saffron border -->
  <circle cx="120" cy="120" r="116" fill="#FFFAF0" stroke="#D97706" stroke-width="4"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Dot accents -->
  <circle cx="120" cy="20" r="4" fill="#D97706"/>
  <circle cx="220" cy="120" r="4" fill="#D97706"/>
  <circle cx="120" cy="220" r="4" fill="#D97706"/>
  <circle cx="20" cy="120" r="4" fill="#D97706"/>
  <!-- Kuthu Vilakku (traditional lamp) - simplified icon -->
  <!-- Flame -->
  <ellipse cx="120" cy="60" rx="10" ry="16" fill="#EF4444" opacity="0.9"/>
  <ellipse cx="120" cy="64" rx="6" ry="10" fill="#F97316" opacity="0.8"/>
  <!-- Lamp body -->
  <ellipse cx="120" cy="82" rx="18" ry="8" fill="none" stroke="#D97706" stroke-width="3"/>
  <ellipse cx="120" cy="82" rx="10" ry="4" fill="#D97706"/>
  <!-- Stand -->
  <line x1="120" y1="90" x2="120" y2="118" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
  <!-- Base platform -->
  <rect x="96" y="118" width="48" height="7" rx="3.5" fill="#D97706"/>
  <rect x="88" y="125" width="64" height="5" rx="2.5" fill="#B45309"/>
  <!-- Divider -->
  <line x1="50" y1="142" x2="190" y2="142" stroke="#D97706" stroke-width="1.5"/>
  <!-- Text -->
  <text x="120" y="163" text-anchor="middle" font-size="11" font-family="Arial,sans-serif" font-weight="700" fill="#92400E" letter-spacing="1.5">GOVERNMENT OF</text>
  <text x="120" y="181" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" font-weight="900" fill="#92400E" letter-spacing="2">TAMIL NADU</text>
  <text x="120" y="200" text-anchor="middle" font-size="9" font-family="Arial,sans-serif" fill="#B45309" letter-spacing="1">தமிழ் நாடு அரசு</text>
</svg>
